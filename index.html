var PETUNJUK_ISI = {

function isiPenanda(teks, nilai, mode) {
  return teks.replace(/\{([A-Z_]+)\}/g, function(_, k) {
    var v = nilai[k];
    if (v) return mode === "html" ? esc(v) : v;
    return mode === "html" ? '<mark class="kosong-legal">[' + esc(PETUNJUK_ISI[k] || k) + " belum diisi]</mark>" : "[ISI: " + (PETUNJUK_ISI[k] || k) + "]";
  });

function naskahHtml(jenis, L2, instansi, versi, berlaku) {

  };
  h.push("<p>" + par(N.pembuka) + "</p>");
  N.bagian.forEach(function(b, i) {
    h.push("<h3>" + (i + 1) + ". " + esc(b[0]) + "</h3>");
    var daftar = [];
    b[1].forEach(function(t) {
      if (t.indexOf("- ") === 0) {
        daftar.push("<li>" + par(t.slice(2)) + "</li>");
        return;
      }
      if (daftar.length) {
        h.push("<ul>" + daftar.join("") + "</ul>");
        daftar = [];
      }
      h.push("<p>" + par(t) + "</p>");
    });
    if (daftar.length) h.push("<ul>" + daftar.join("") + "</ul>");
  });
  h.push('<p class="kecil redup">Versi naskah ' + esc(versi || "") + (berlaku ? " \xB7 berlaku sejak " + esc(fmtTgl(berlaku)) : "") + "</p>");
  return raw('<div class="naskah">' + h.join("") + "</div>");
